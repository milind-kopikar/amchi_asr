# 1-epoch full data test (lr=1e-4) - uses data/train/dev/test manifests pulled from Railway

model:
  nemo_model: "models/indicconformer_stt_mr_hybrid_ctc_rnnt_large/indicconformer_stt_mr_hybrid_rnnt_large.nemo"
  tokenizer:
    dir: "tokenizers"
    model_path: "tokenizers/marathi_tokenizer.model"
    type: "bpe"
  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: 16000
    normalize: "per_feature"
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    features: 80
    n_fft: 512
    frame_splicing: 1
    dither: 0.00001
    pad_to: 16
    stft_conv: false
  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: 80
    feat_out: -1
    n_layers: 18
    d_model: 512
  loss:
    loss_name: "default"
  decoder_type: "ctc"

trainer:
  devices: 1
  accelerator: "gpu"
  max_epochs: 1
  max_steps: -1
  num_nodes: 1
  accumulate_grad_batches: 1
  enable_checkpointing: true
  logger: false
  log_every_n_steps: 10
  check_val_every_n_epoch: 1
  strategy: null

optim:
  name: adamw
  lr: 1e-4
  weight_decay: 0.001

# Data configuration: use full manifests generated from Railway
data:
  train_ds:
    manifest_filepath: "data/train/manifest.jsonl"
    sample_rate: 16000
    batch_size: 4
    shuffle: true
    num_workers: 4
    pin_memory: true
    max_duration: 30.0
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: false
  validation_ds:
    manifest_filepath: "data/dev/manifest.jsonl"
    sample_rate: 16000
    batch_size: 8
    shuffle: false
    num_workers: 4
    pin_memory: true
    max_duration: 30.0
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: false
  test_ds:
    manifest_filepath: "data/test/manifest.jsonl"
    sample_rate: 16000
    batch_size: 8
    shuffle: false
    num_workers: 4
    pin_memory: true
    max_duration: 30.0
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: false

exp_manager:
  exp_dir: "/workspace/amchi_asr/nemo_experiments"
  name: "Amchi_Marathi_full_1epoch_lr1e-4"
  create_tensorboard_logger: false
  create_checkpoint_callback: true
  always_save_nemo: false
  checkpoint_callback_params:
    monitor: "val_loss"
    mode: "min"
    save_top_k: 3
    save_last: false
    filename: "amchi_marathi_full_1epoch_lr1e-4-{epoch:02d}-{val_loss:.3f}"

custom_config:
  language: "mr"
  base_model: "marathi_official"
  fine_tune_strategy: "full_finetune"
