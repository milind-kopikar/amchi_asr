# MMS Smoke config
model:
  base_model: "facebook/mms-1b-all"
  model_type: "wav2vec2-mms"
  freeze_feature_encoder: true

training:
  output_dir: "results/smoke/mms_konkani"
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 3e-5
  warmup_steps: 10
  max_steps: 5
  logging_steps: 1
  save_steps: 5
  eval_steps: 5
  eval_strategy: "steps"
  save_strategy: "steps"
  save_total_limit: 1
  push_to_hub: false

data:
  train_manifest: "data/test_run/train.tsv"
  dev_manifest: "data/test_run/dev.tsv"
  test_manifest: "data/test_run/test.tsv"
  audio_dir: "."
  sampling_rate: 16000

# Language adapter to activate during inference/training when supported
language:
  default: "kok"  # Konkani
  choices: ["kok","mar","hin","san"]

testing:
  num_test_samples: 3
  display_results: true
