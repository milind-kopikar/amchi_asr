# Fine-tuning config: Amchi Konkani ASR — Run S (Speaker-Stratified Split)
#
# Identical to amchi_konkani_run_c.yaml EXCEPT for data paths.
# Uses speaker-stratified manifests generated by:
#   python3 scripts/create_speaker_stratified_split.py \
#       --train_manifest data/amchi/train/manifest.jsonl \
#       --dev_manifest   data/amchi/dev/manifest.jsonl \
#       --test_manifest  data/amchi/test/manifest.jsonl \
#       --output_dir     data/amchi_stratified --seed 42
#
# Purpose:
#   Tests whether dipti's WER improves when she has ~27 training samples
#   (vs 3 in the story-based split). Also ensures dipti appears in dev so
#   ModelCheckpoint accounts for her voice during checkpoint selection.
#
# Split statistics (seed=42):
#   ashaheble  : 148 train /  32 dev /  31 test
#   lalimomadi : 138 train /  30 dev /  29 test
#   dipti      :  27 train /   6 dev /   5 test   ← was 3 / 0 / 35
#   avkulkarni :  88 train /  19 dev /  18 test   (not in original test)
#   arursushama:  30 train /   6 dev /   7 test
#   sheela     :  29 train /   6 dev /   6 test
#   milindkopi :  10 train /   2 dev /   3 test
#   mokshkopi  :   3 train /   0 dev /   0 test   (too few)
#   ─────────────────────────────────────────────
#   Total      : 473 train / 101 dev /  99 test
#
# Text overlap note:
#   Because dipti only recorded Story 5 content, some Story 5 sentences
#   appear in training (via dipti) and test (via ashaheble/lalimomadi).
#   This is acceptable for CTC ASR — the model learns audio→token mappings,
#   not text sequences. Different speakers produce different spectrograms.

freeze_encoder: true   # Only CTC decoder (~132K params) trained

model:
  language: "mr"
  nemo_model: "models/indicconformer_stt_mr_hybrid_ctc_rnnt_large/indicconformer_stt_mr_hybrid_rnnt_large.nemo"
  tokenizer:
    dir: "tokenizers"
    model_path: "tokenizers/marathi_tokenizer.model"
    type: "bpe"
  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: 16000
    normalize: "per_feature"
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    features: 80
    n_fft: 512
    frame_splicing: 1
    dither: 0.00001
    pad_to: 16
    stft_conv: false
  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: 80
    feat_out: -1
    n_layers: 18
    d_model: 512
  loss:
    loss_name: "ctc"
  decoder_type: "ctc"

trainer:
  devices: 1
  accelerator: "gpu"
  max_epochs: 100
  max_steps: -1
  num_nodes: 1
  accumulate_grad_batches: 1
  enable_checkpointing: true
  logger: true
  log_every_n_steps: 5
  check_val_every_n_epoch: 1
  strategy: null

optim:
  name: adamw
  lr: 0.0001
  weight_decay: 0.01
  sched:
    name: CosineAnnealing
    warmup_steps: 500
    min_lr: 0.000001

data:
  train_ds:
    manifest_filepath: "data/amchi_stratified/train/manifest.jsonl"
    sample_rate: 16000
    batch_size: 4
    shuffle: true
    num_workers: 4
    pin_memory: true
    max_duration: 30.0
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: false
  validation_ds:
    manifest_filepath: "data/amchi_stratified/dev/manifest.jsonl"
    sample_rate: 16000
    batch_size: 4
    shuffle: false
    num_workers: 4
    pin_memory: true
    max_duration: 30.0
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: false
  test_ds:
    manifest_filepath: "data/amchi_stratified/test/manifest.jsonl"
    sample_rate: 16000
    batch_size: 4
    shuffle: false
    num_workers: 4
    pin_memory: true
    max_duration: 30.0
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: false

exp_manager:
  exp_dir: "/workspace/nemo_experiments"
  name: "amchi_konkani_run_c_stratified"
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  always_save_nemo: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 3
