# NeMo Smoke Test Configuration
# Quick training config for testing pipeline with minimal data

model:
  nemo_model: "models/indicconformer_mr/indicconformer_stt_mr_hybrid_rnnt_large.nemo"
  tokenizer:
    dir: "models/indicconformer_mr"
    type: "bpe"
  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: 16000
    normalize: "per_feature"
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    features: 80
    n_fft: 512
    frame_splicing: 1
    dither: 0.00001
    pad_to: 16
    stft_conv: false

trainer:
  devices: 1
  accelerator: "gpu"
  max_epochs: 5  # Very few epochs for smoke test
  max_steps: -1
  num_nodes: 1
  accumulate_grad_batches: 1
  enable_checkpointing: true
  logger: false
  log_every_n_steps: 1
  check_val_every_n_epoch: 1

optim:
  name: adamw
  lr: 0.0001
  weight_decay: 0.001
  sched:
    name: "cosine"
    warmup_steps: 10  # Very short warmup
    min_lr: 0.00001
    last_epoch: -1

data:
  train_ds:
    manifest_filepath: "data_smoke/train/manifest.jsonl"
    sample_rate: 16000
    batch_size: 2  # Small batch for smoke test
    shuffle: true
    num_workers: 2
    pin_memory: true
    max_duration: 16.7
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false

  validation_ds:
    manifest_filepath: "data_smoke/dev/manifest.jsonl"
    sample_rate: 16000
    batch_size: 2
    shuffle: false
    num_workers: 2
    pin_memory: true
    max_duration: 16.7
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false

exp_manager:
  exp_dir: "results/"
  name: "smoke_test"
  create_tensorboard_logger: false
  create_checkpoint_callback: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 1
    save_last: true
    filename: "smoke_test-{epoch:02d}"
