# Quick overfit config for smoke data
# Based on konkani_finetune.yaml with small dataset for overfitting sanity check

model:
  nemo_model: "models/indicconformer_mr/indicconformer_stt_mr_hybrid_rnnt_large_patched.nemo"
  tokenizer:
    dir: "models/indicconformer_mr/unpacked"
    type: "bpe"

preprocessor:
  _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
  sample_rate: 16000
  normalize: "per_feature"
  window_size: 0.025
  window_stride: 0.01
  window: "hann"
  features: 80

encoder:
  _target_: nemo.collections.asr.modules.ConformerEncoder
  feat_in: 80
  feat_out: -1
  n_layers: 18
  d_model: 512

decoder:
  _target_: nemo.collections.asr.modules.RNNTDecoder
  blank_as_pad: true
  unk: "<unk>"

trainer:
  devices: 1
  accelerator: "gpu"
  max_epochs: 20
  max_steps: -1
  num_nodes: 1
  accumulate_grad_batches: 1
  enable_checkpointing: false
  logger: false
  log_every_n_steps: 1
  check_val_every_n_epoch: 1

optim:
  name: adamw
  lr: 1e-4

data:
  train_ds:
    manifest_filepath: "data/train/manifest.jsonl"
    sample_rate: 16000
    batch_size: 3
    shuffle: true
    num_workers: 2
    pin_memory: true
    max_duration: 16.7
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: true

  validation_ds:
    manifest_filepath: "data/dev/manifest.jsonl"
    sample_rate: 16000
    batch_size: 3
    shuffle: false
    num_workers: 2
    pin_memory: true
    max_duration: 16.7
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: true

exp_manager:
  exp_dir: "results/overfit_smoke"
  name: "overfit_smoke"
  create_tensorboard_logger: false
  create_checkpoint_callback: false
