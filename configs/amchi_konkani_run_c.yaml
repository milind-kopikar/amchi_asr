# Fine-tuning config: Amchi Konkani ASR — Run C (RECOMMENDED NEXT)
# Combines: Frozen Encoder + Cosine LR Scheduling + 100 Epochs + Higher Weight Decay
# Rationale:
#   - freeze_encoder: reduces trainable params 119M -> ~4.4M (prevents overfitting)
#   - Cosine LR with warmup: better convergence than flat 0.0001 (which caused val_loss to double)
#   - 100 epochs: model was still improving at epoch 47 in previous run; more time to converge
#   - weight_decay 0.01 (vs 0.001): additional L2 regularisation
#
# Previous run (50 epochs, no freeze, flat LR): test WER 54.7%; val_loss doubled epoch 6->49
# Expected: significantly lower WER due to reduced overfitting
#
# Data:
#   Train: Stories 1, 2, 3, 7  (511 samples)
#   Dev:   Story 4              (58 samples)
#   Test:  Story 5              (104 samples, 3 speakers)
#
# Run this after pip-fixing cu128 and applying conv_asr patch. See AMCHI_KONKANI_FINETUNING_TODOS.md.

freeze_encoder: true   # Only decoder (~4.4M params) trained

model:
  language: "mr"
  nemo_model: "models/indicconformer_stt_mr_hybrid_ctc_rnnt_large/indicconformer_stt_mr_hybrid_rnnt_large.nemo"
  tokenizer:
    dir: "tokenizers"
    model_path: "tokenizers/marathi_tokenizer.model"
    type: "bpe"
  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: 16000
    normalize: "per_feature"
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    features: 80
    n_fft: 512
    frame_splicing: 1
    dither: 0.00001
    pad_to: 16
    stft_conv: false
  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: 80
    feat_out: -1
    n_layers: 18
    d_model: 512
  loss:
    loss_name: "ctc"
  decoder_type: "ctc"

trainer:
  devices: 1
  accelerator: "gpu"
  max_epochs: 100
  max_steps: -1
  num_nodes: 1
  accumulate_grad_batches: 1
  enable_checkpointing: true
  logger: true
  log_every_n_steps: 5
  check_val_every_n_epoch: 1
  strategy: null

optim:
  name: adamw
  lr: 0.0001
  weight_decay: 0.01    # Stronger regularisation (was 0.001 in 50-epoch run)
  sched:
    name: CosineAnnealing
    warmup_steps: 500   # ~4 epochs of warmup (128 steps/epoch * 4 = 512 steps)
    min_lr: 0.000001    # Floor for cosine decay

data:
  train_ds:
    manifest_filepath: "data/amchi/train/manifest.jsonl"
    sample_rate: 16000
    batch_size: 4
    shuffle: true
    num_workers: 4
    pin_memory: true
    max_duration: 30.0
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: false
  validation_ds:
    manifest_filepath: "data/amchi/dev/manifest.jsonl"
    sample_rate: 16000
    batch_size: 4
    shuffle: false
    num_workers: 4
    pin_memory: true
    max_duration: 30.0
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: false
  test_ds:
    manifest_filepath: "data/amchi/test/manifest.jsonl"
    sample_rate: 16000
    batch_size: 4
    shuffle: false
    num_workers: 4
    pin_memory: true
    max_duration: 30.0
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: false

exp_manager:
  exp_dir: "/workspace/nemo_experiments"
  name: "amchi_konkani_run_c_frozen_cosine_100ep"
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  always_save_nemo: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 3
