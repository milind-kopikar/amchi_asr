# Temporary config for 20-epoch micro-overfit on tiny manifests
# Based on configs/konkani_finetune.yaml with small overrides for quick overfit

model:
  nemo_model: "models/indicconformer_mr/indicconformer_stt_mr_hybrid_rnnt_large_patched.nemo"
  tokenizer:
    dir: "models/tokenizer"
    type: "bpe"
  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: 16000
    normalize: "per_feature"
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    features: 80
    n_fft: 512
    frame_splicing: 1
    dither: 0.00001
    pad_to: 16
    stft_conv: false
  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: 80
    feat_out: -1
    n_layers: 18
    d_model: 512
    subsampling: "striding"
    subsampling_factor: 4
    subsampling_conv_channels: 512
    ff_expansion_factor: 4
    self_attention_model: "rel_pos"
    n_heads: 8
    att_context_size: [-1, -1]
    att_context_style: "regular"
    xscaling: true
    untie_biases: true
    pos_emb_max_len: 5000
    conv_kernel_size: 31
    conv_norm_type: "batch_norm"
    dropout: 0.1
    dropout_emb: 0.0
    dropout_att: 0.1
  decoder:
    _target_: nemo.collections.asr.modules.RNNTDecoder
    vocabulary: null
    blank_as_pad: true
    unk: "<unk>"
  joint:
    _target_: nemo.collections.asr.modules.RNNTJoint
    vocabulary: null
    jointnet:
      _target_: nemo.collections.asr.modules.RNNTJoint
      encoder_hidden: 512
      pred_hidden: 320
      joint_hidden: 512
      activation: "relu"
      dropout: 0.0
  loss:
    loss_name: "ctc"
  decoder_type: "ctc"

trainer:
  devices: 1
  accelerator: "gpu"
  max_epochs: 20
  max_steps: -1
  num_nodes: 1
  accumulate_grad_batches: 1
  enable_checkpointing: true
  logger: false
  log_every_n_steps: 10
  check_val_every_n_epoch: 20
  strategy: null

optim:
  name: adamw
  lr: 0.001
  weight_decay: 0.001
  sched:
    name: "CosineAnnealing"
    warmup_steps: 1000
    warmup_ratio: null
    min_lr: 0.000001
    last_epoch: -1

data:
  train_ds:
    manifest_filepath: "tiny_train.jsonl"
    sample_rate: 16000
    batch_size: 8
    shuffle: true
    num_workers: 4
    pin_memory: true
    max_duration: 16.7
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: false
  validation_ds:
    manifest_filepath: "tiny_val.jsonl"
    sample_rate: 16000
    batch_size: 8
    shuffle: false
    num_workers: 4
    pin_memory: true
    max_duration: 16.7
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: false
  test_ds:
    manifest_filepath: "tiny_test.jsonl"
    sample_rate: 16000
    batch_size: 8
    shuffle: false
    num_workers: 4
    pin_memory: true
    max_duration: 16.7
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: true

exp_manager:
  exp_dir: "/workspace/amchi_asr/results"
  name: "Amchi_Konkani_Overfit20"
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  always_save_nemo: false
  checkpoint_callback_params:
    monitor: "val_loss"
    mode: "min"
    save_top_k: 1
    save_last: false
    filename: "amchi_konkani-overfit20-{epoch:02d}-{val_loss:.3f}"

custom_config:
  language: "kok"
  base_model: "marathi_indicconformer"
  fine_tune_strategy: "full_finetune"
