# Fine-tuning config: Amchi Konkani ASR — Run A (Frozen Encoder)
# Base: amchi_konkani_50epoch.yaml with freeze_encoder: true
# Rationale: Encoder has 115M params; freezing it reduces trainable params from 119M -> ~4.4M
#            This massively reduces overfitting on 511 training samples.
#            Previous run (50 epochs, all params): val_loss doubled 49->98; test WER 54.7%
# Expected: Lower overfitting, better generalization to test set.
#
# Data:
#   Train: Stories 1, 2, 3, 7  (511 samples)
#   Dev:   Story 4              (58 samples)
#   Test:  Story 5              (104 samples, 3 speakers)
#
# Run this after pip-fixing cu128 and applying conv_asr patch. See AMCHI_KONKANI_FINETUNING_TODOS.md.

freeze_encoder: true   # Only decoder (~4.4M params) will be trained — encoder weights frozen

model:
  language: "mr"
  nemo_model: "models/indicconformer_stt_mr_hybrid_ctc_rnnt_large/indicconformer_stt_mr_hybrid_rnnt_large.nemo"
  tokenizer:
    dir: "tokenizers"
    model_path: "tokenizers/marathi_tokenizer.model"
    type: "bpe"
  preprocessor:
    _target_: nemo.collections.asr.modules.AudioToMelSpectrogramPreprocessor
    sample_rate: 16000
    normalize: "per_feature"
    window_size: 0.025
    window_stride: 0.01
    window: "hann"
    features: 80
    n_fft: 512
    frame_splicing: 1
    dither: 0.00001
    pad_to: 16
    stft_conv: false
  encoder:
    _target_: nemo.collections.asr.modules.ConformerEncoder
    feat_in: 80
    feat_out: -1
    n_layers: 18
    d_model: 512
  loss:
    loss_name: "ctc"
  decoder_type: "ctc"

trainer:
  devices: 1
  accelerator: "gpu"
  max_epochs: 50
  max_steps: -1
  num_nodes: 1
  accumulate_grad_batches: 1
  enable_checkpointing: true
  logger: true
  log_every_n_steps: 5
  check_val_every_n_epoch: 1
  strategy: null

optim:
  name: adamw
  lr: 0.0001
  weight_decay: 0.001

data:
  train_ds:
    manifest_filepath: "data/amchi/train/manifest.jsonl"
    sample_rate: 16000
    batch_size: 4
    shuffle: true
    num_workers: 4
    pin_memory: true
    max_duration: 30.0
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: false
  validation_ds:
    manifest_filepath: "data/amchi/dev/manifest.jsonl"
    sample_rate: 16000
    batch_size: 4
    shuffle: false
    num_workers: 4
    pin_memory: true
    max_duration: 30.0
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: false
  test_ds:
    manifest_filepath: "data/amchi/test/manifest.jsonl"
    sample_rate: 16000
    batch_size: 4
    shuffle: false
    num_workers: 4
    pin_memory: true
    max_duration: 30.0
    min_duration: 0.1
    trim_silence: true
    load_audio: true
    use_start_end_token: false
    return_language_id: false

exp_manager:
  exp_dir: "/workspace/nemo_experiments"
  name: "amchi_konkani_run_a_frozen_encoder"
  create_tensorboard_logger: true
  create_checkpoint_callback: true
  always_save_nemo: true
  checkpoint_callback_params:
    monitor: "val_wer"
    mode: "min"
    save_top_k: 3
