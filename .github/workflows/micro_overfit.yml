name: Micro-overfit Acceptance (manual)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 0' # weekly on Sunday at 03:00 UTC (optional)

jobs:
  micro-overfit-acceptance:
    runs-on: ubuntu-latest
    env:
      PYTHON: python3.11
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run micro-overfit acceptance unit tests (fast)
        env:
          RUN_MICRO_OVERFIT: '1'
          SKIP_MICRO_PREFLIGHT: '1'
          SKIP_MICRO_TRAIN: '1'
        run: |
          pytest -q tests/test_micro_overfit_acceptance.py -q
