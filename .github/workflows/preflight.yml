name: Preflight & Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  preflight:
    name: Run preflight checks and unit tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install lightweight deps
      run: |
        python -m pip install --upgrade pip
        pip install sentencepiece pytest pyyaml
        # Install torch (cpu) to allow basic import checks
        pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio

    - name: Run pytest (preflight unit tests)
      run: |
        pytest -q tests/test_unit_preflight.py tests/test_tokenizer_nemo_consistency.py

    - name: Run full preflight script
      run: |
        # run the script (it returns non-zero if checks fail); we want CI to fail so we detect regressions early
        python3 scripts/preflight_checks.py
